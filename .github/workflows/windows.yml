name: Windows

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install \
            PyQt5 pynput mss sounddevice \
            Pillow numpy ffmpeg-python opencv-python-headless \
            python-xlib pyinstaller

      - name: Build .exe with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller recordly-windows.spec \
            --distpath=dist \
            --workpath=build \
            --noconfirm

      - name: Stage single-file exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg-out | Out-Null
          if (Test-Path "dist/recordly.exe") {
              Copy-Item "dist/recordly.exe" "pkg-out/recordly.exe"
          } elseif (Test-Path "dist/recordly/recordly.exe") {
              # one-folder 模式：打 zip
              Compress-Archive -Path "dist/recordly/*" -DestinationPath "pkg-out/recordly-windows.zip"
          } else {
              Get-ChildItem -Recurse dist | Select-Object FullName
              throw "PyInstaller output not found"
          }
          Get-ChildItem pkg-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recordly-windows
          path: pkg-out/*
          if-no-files-found: error
          retention-days: 90