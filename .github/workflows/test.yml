name: Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libglib2.0-0 \
            libegl1 libxkbcommon0 libfontconfig1

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 从 pyproject.toml 安装（含 test 可选依赖），避免 CI 依赖列表漂移
          pip install -e .[test]

      - name: Unit tests
        shell: bash
        run: |
          python -m pytest tests/ \
            -v --tb=short \
            --cov=app --cov=core --cov=ui \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Build & smoke test wheel installation
        shell: bash
        run: |
          pip install build
          python -m build --wheel
          pip install --no-deps dist/*.whl
          python -c "import app.resources; print('Resources loader import OK')"
          python -c "from app.resources import load_text; text = load_text('style.qss'); assert 'QMainWindow' in text, 'style.qss missing from wheel'"
          echo "Wheel package smoke test passed on ${{ runner.os }} / Python ${{ matrix.python-version }}"

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
