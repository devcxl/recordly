name: Build Packages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debhelper \
            devscripts \
            fakeroot \
            build-essential \
            dh-python \
            pybuild-plugin-pyproject \
            python3 \
            python3-setuptools \
            python3-pip \
            python3-pyqt5 \
            python3-pil \
            python3-numpy \
            python3-opencv \
            python3-xlib \
            python3-pynput \
            ffmpeg \
            libportaudio2 \
            pulseaudio-utils

      - name: Build Debian package
        run: |
          dpkg-buildpackage -b -us -uc -j$(nproc)
        env:
          DEB_BUILD_OPTIONS: nocheck

      - name: Collect .deb artifact
        shell: bash
        run: |
          mkdir -p pkg-out
          cp ../recordly_*.deb pkg-out/
          ls -lh pkg-out/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: recordly-deb-ubuntu-24.04
          path: pkg-out/*.deb
          if-no-files-found: error
          retention-days: 90

      - name: Smoke test install .deb in clean container
        run: |
          set -euxo pipefail
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon0 libgl1 libegl1 libfontconfig1 \
            libdbus-1-3
          # 安装包（保留依赖）
          sudo dpkg -i pkg-out/recordly_*.deb || sudo apt-get install -f -y --no-install-recommends
          # 验证主入口存在且 desktop file 合法
          test -x /usr/bin/recordly
          desktop-file-validate /usr/share/applications/recordly.desktop
          # offscreen 启动主程序 5 秒，确认无 ImportError 崩溃
          timeout 5s xvfb-run -a recordly || true
          echo "Smoke test passed."

  build-aur:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package version
        id: version
        shell: bash
        run: |
          echo "version=1.2.0dev" >> "$GITHUB_OUTPUT"

      - name: Build AUR package
        uses: ./.github/actions/build-aur
        with:
          pkgver: ${{ steps.version.outputs.version }}
          pkgrel: "1"

      - name: Upload AUR artifact
        uses: actions/upload-artifact@v4
        with:
          name: recordly-aur
          path: .aur/out/*.pkg.tar.zst
          if-no-files-found: warn
          retention-days: 90
