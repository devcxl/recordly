name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debhelper \
            devscripts \
            fakeroot \
            build-essential \
            dh-python \
            pybuild-plugin-pyproject \
            python3 \
            python3-setuptools \
            python3-pip \
            python3-pyqt5 \
            python3-pil \
            python3-numpy \
            python3-opencv \
            python3-xlib \
            python3-pynput \
            python3-future \
            ffmpeg \
            libportaudio2 \
            pulseaudio-utils

      - name: Build Debian package
        run: |
          dpkg-buildpackage -b -us -uc -j$(nproc)
        env:
          DEB_BUILD_OPTIONS: nocheck

      - name: Collect .deb artifact
        shell: bash
        run: |
          mkdir -p pkg-out
          cp ../recordly_*.deb pkg-out/
          ls -lh pkg-out/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: recordly-deb-ubuntu-24.04
          path: pkg-out/*.deb
          if-no-files-found: error
          retention-days: 90

  build-aur:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build AUR package
        uses: ./.github/actions/build-aur
        with:
          pkgver: ${{ steps.version.outputs.version }}
          pkgrel: "1"

      - name: Upload AUR artifact
        uses: actions/upload-artifact@v4
        with:
          name: recordly-aur
          path: .aur/out/*.pkg.tar.zst
          if-no-files-found: warn
          retention-days: 90

  build-windows:
    uses: ./.github/workflows/windows.yml

  build-macos:
    uses: ./.github/workflows/macos.yml

  release:
    runs-on: ubuntu-24.04
    needs: [build-deb, build-aur, build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        shell: bash
        run: find . -type f \( -name "*.deb" -o -name "*.pkg.tar.zst" -o -name "*.exe" -o -name "recordly-macos.tar.gz" -o -name "recordly-windows.zip" \) | sort

      - name: Compute version without v prefix
        id: ver
        run: echo "pkgver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            recordly-deb-ubuntu-24.04/recordly_${{ steps.ver.outputs.pkgver }}-*_all.deb
            recordly-aur/recordly-${{ steps.ver.outputs.pkgver }}-*-any.pkg.tar.zst
            recordly-windows/recordly.exe
            recordly-windows/recordly-windows.zip
            recordly-macos/*
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: false
