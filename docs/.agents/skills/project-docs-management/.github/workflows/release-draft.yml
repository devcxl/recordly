name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    name: Build and Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build PyYAML -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Build Python Distribution Package
        run: |
          python -m build

      - name: Build Debian Package
        run: |
          ./scripts/build-deb.sh "${{ github.ref_name }}"

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --draft \
            --title "${{ github.ref_name }}" \
            --generate-notes
